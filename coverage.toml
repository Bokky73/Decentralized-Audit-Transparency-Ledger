# Coverage configuration for Decentralized Audit & Transparency Ledger (Issue #900)

[coverage]
minimum_line_coverage = 90.0
minimum_branch_coverage = 85.0
fail_under = 90.0

[modules]
include = [
    "src/lib.rs",
    "src/rbac.rs",
    "src/capacity_planning.rs",
]
test_suites = [
    "src/test.rs",
    "src/rbac_gating_tests.rs",
]

[compliance]
require_rbac_gating = true
require_tamper_evident_audit_events = true

