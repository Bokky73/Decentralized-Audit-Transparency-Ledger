[package]
name = "audit-ledger-sdk"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for the AuditLedger Soroban smart contract"
repository = "https://github.com/daddygokings-art/Decentralized-Audit-Transparency-Ledger"
license = "MIT"

[dependencies]
reqwest = { version = "0.13", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
url = "2.0"
thiserror = "2.0"